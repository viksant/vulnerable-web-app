services:
  postgres:
    image: postgres:15-alpine
    # VULN: Misconfiguration - Database port exposed to host, allows direct access bypassing app
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vulnshop
      POSTGRES_PASSWORD: vulnsh0p_db!
      POSTGRES_DB: vulnshop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnshop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    # VULN: Misconfiguration - No password, protected mode disabled, port exposed to host
    command: ["redis-server", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build: ./backend
    # VULN: Misconfiguration - Backend exposed directly, bypasses nginx proxy controls
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - uploads:/app/uploads
      - ./db/init.sql:/app/init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - metadata

  frontend:
    build: ./frontend
    volumes:
      - frontend_dist:/srv
    healthcheck:
      test: ["CMD", "test", "-f", "/srv/index.html"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - default

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - default

  metadata-mock:
    build: ./metadata-mock
    # No ports exposed to host — only reachable from backend via metadata network
    networks:
      metadata:
        ipv4_address: 169.254.169.254

networks:
  default:
    driver: bridge
  metadata:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 169.254.169.0/24

volumes:
  pgdata:
  uploads:
  frontend_dist:
  caddy_data:
  caddy_config:
